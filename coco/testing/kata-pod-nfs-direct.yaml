---
# Step 1 of the direct in-pod NFS mount test - single container, no sidecar.
#
# The pod mounts the NFS share served by the helper node itself, from inside the
# Kata guest, over the pod network. There is no PV/PVC and no kubelet-side NFS
# mount, so nothing is mounted on the worker node.
#
# Test with runtimeClassName "kata" first (exec and logs are unrestricted there),
# then move to kata-cc using testing/kata-cc-pod-nfs-direct.yaml.
#
# Replace: image, NFS_SERVER (helper IP), NFS_EXPORT.
apiVersion: v1
kind: Pod
metadata:
  name: nfs-direct-check
  labels:
    app: nfs-direct-check
  annotations:
    io.katacontainers.config.hypervisor.default_memory: "4096"
spec:
  runtimeClassName: kata
  restartPolicy: Never
  containers:
  - name: nfs-client
    # Any image carrying nfs-utils works. quay.io/rh-ee-chbutler/ubi-storage-util
    # ships nfs-utils and needs no build; coco/nfs/Containerfile builds one if you
    # need it mirrored.
    image: quay.io/rh-ee-chbutler/ubi-storage-util:latest
    securityContext:
      privileged: true # mount(2) needs CAP_SYS_ADMIN, and modprobe needs CAP_SYS_MODULE - both only inside the Kata VM
      runAsUser: 0
    volumeMounts:
      - name: host-modules
        mountPath: /usr/lib/modules
        readOnly: true
    env:
      - name: NFS_SERVER
        value: "192.168.122.1"   # helper node IP. Use an IP - cluster DNS does not resolve helper names.
      - name: NFS_EXPORT
        value: "/srv/nfs/kata"
      - name: MOUNTPOINT
        value: "/mnt/nfs"
      - name: NFS_OPTS
        value: "vers=4.2,rw,hard,timeo=600,retrans=2,sec=sys"
    command: ["/bin/bash", "-c"]
    args:
      - |
        set -x

        echo "### 1. load the NFSv4 version module into the guest kernel"
        # The guest rootfs ships nfs.ko but NOT nfsv4.ko, so the kernel's
        # on-demand request_module("nfsv4") fails and every 4.x mount returns
        # EPROTONOSUPPORT ("Protocol not supported"). /proc/filesystems lists
        # both nfs and nfs4 regardless, because nfs.ko registers those names
        # before any version module is loaded - it is not evidence of support.
        V=$(uname -r)
        grep -E '^(nfs|nfsv4|sunrpc) ' /proc/modules || true
        grep -q '^nfsv4 ' /proc/modules || modprobe -S "$V" nfsv4 \
          || echo "WARNING: could not load nfsv4 for $V - the mount below will fail with 'Protocol not supported'"
        grep -E '^(nfs|nfsv4|sunrpc) ' /proc/modules

        echo "### 2. is the helper reachable over the pod network?"
        ip -4 addr show
        ip -4 route show
        ping -c 2 "$NFS_SERVER" || true
        nc -vz -w 5 "$NFS_SERVER" 2049

        echo "### 3. mount the export"
        mkdir -p "$MOUNTPOINT"
        mount -t nfs -o "$NFS_OPTS" "${NFS_SERVER}:${NFS_EXPORT}" "$MOUNTPOINT"
        findmnt "$MOUNTPOINT"
        nfsstat -m

        echo "### 4. read what the helper seeded, then write from the pod"
        ls -l "$MOUNTPOINT"
        cat "$MOUNTPOINT/from-helper.txt"
        echo "written by $(hostname) at $(date -Is)" > "${MOUNTPOINT}/from-pod-$(hostname).txt"
        cat "${MOUNTPOINT}/from-pod-$(hostname).txt"
        df -hT "$MOUNTPOINT"

        echo "### NFS mount test PASSED - keeping the pod alive for inspection"
        sleep 36000
  volumes:
    # The plain kata handler boots a kernel built from the host's, so the host
    # module tree matches the guest kernel exactly and nfsv4.ko loads from it.
    # This does NOT hold for kata-cc: its guest kernel is a different build, and
    # loading host-supplied kernel code into a confidential guest would hand the
    # host exactly the influence the guest is meant to be protected from.
    - name: host-modules
      hostPath:
        path: /usr/lib/modules
        type: Directory
