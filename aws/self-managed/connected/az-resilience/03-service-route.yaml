---
apiVersion: v1
kind: Service
metadata:
  name: hello-az
  namespace: az-resilience-demo
  labels:
    app: hello-az
spec:
  selector:
    app: hello-az
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# Router pods themselves are spread across AZs by the default ingress
# controller, so the Route stays reachable while one zone is down. Curl it in a
# loop during the test -- every response names the pod and node that served it,
# which is how you show the surviving zones picked up the traffic.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: hello-az
  namespace: az-resilience-demo
  labels:
    app: hello-az
spec:
  # Leave host unset to let the router assign
  # hello-az-az-resilience-demo.apps.<cluster>.<base-domain>, or substitute
  # your own hostname here.
  to:
    kind: Service
    name: hello-az
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
