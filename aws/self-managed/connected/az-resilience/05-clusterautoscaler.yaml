---
# Cluster-scoped autoscaler policy. The name MUST be "default" -- the
# machine-api operator ignores any other ClusterAutoscaler.
#
# This CR only sets global limits and scale-down behaviour; it does not by
# itself make anything scale. Each MachineSet you want scaled needs its own
# MachineAutoscaler (see 06-machineautoscaler.yaml).
#
# ---------------------------------------------------------------------------
# DO NOT APPLY THIS ON ROSA (or any other managed OpenShift).
#
# On ROSA the machine-api is owned by Red Hat SRE. You do not manage
# MachineSets, and ClusterAutoscaler/MachineAutoscaler CRs are not the
# supported interface -- creating them is rejected or silently reconciled away.
# Autoscaling is a property of the machine pool / node pool instead, set in the
# Hybrid Cloud Console (console.redhat.com/openshift -> your cluster ->
# Machine pools -> Edit -> Enable autoscaling, with min/max nodes) or with the
# rosa CLI:
#
#   rosa edit machinepool --cluster <cluster> --enable-autoscaling \
#     --min-replicas 3 --max-replicas 12 <machinepool>
#
# ROSA Classic also exposes the cluster-wide autoscaler settings this CR
# carries (scale-down timers, resource limits, balance-similar-node-groups) as
# a separate managed object -- check `rosa create autoscaler --help` for your
# CLI version. On ROSA HCP autoscaling is configured per node pool only.
#
# Everything else in this directory works unchanged on ROSA: the Deployment,
# the spread constraints, the PDB and the Descheduler operator are all ordinary
# user-namespace or OLM objects. Skip 05, 06 and 07 only.
# See resilience-testing.md, "Running this on ROSA".
# ---------------------------------------------------------------------------
apiVersion: autoscaling.openshift.io/v1
kind: ClusterAutoscaler
metadata:
  name: default
spec:
  podPriorityThreshold: -10
  resourceLimits:
    maxNodesTotal: 24
    cores:
      min: 8
      max: 128
    memory:
      min: 4
      max: 512
  # With one MachineSet per AZ, this keeps scale-out even across the surviving
  # zones instead of piling every new worker into whichever zone the autoscaler
  # happened to pick first.
  balanceSimilarNodeGroups: true
  # The demo pods mount emptyDir volumes, which the autoscaler classifies as
  # local storage. Left at the default (true) it refuses to drain those nodes
  # and the extra workers added during the outage are never removed after the
  # AZ recovers. Set to false only when you are sure no workload depends on
  # emptyDir contents surviving -- true for this stateless app.
  skipNodesWithLocalStorage: false
  scaleDown:
    enabled: true
    delayAfterAdd: 10m
    delayAfterDelete: 10s
    delayAfterFailure: 3m
    unneededTime: 10m
    utilizationThreshold: "0.5"
  logVerbosity: 4
