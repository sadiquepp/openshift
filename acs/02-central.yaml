# Central, in its own project. Red Hat recommends not putting it in the
# operator's project.
#
# Deliberately minimal. Scanner V4 is the default scanner for new installs from
# RHACS 4.8 onward, so it is left unset rather than configured here: pinning
# fields whose names move between releases is how a CR stops applying after an
# upgrade. Check what you actually got once Central is up:
#
#   oc get pods -n stackrox | grep -i scanner
#
# scanner-v4-* pods mean Scanner V4; a lone `scanner-*` with `scanner-db-*`
# means the older StackRox Scanner, deprecated since 4.6.
---
apiVersion: v1
kind: Namespace
metadata:
  name: stackrox
---
apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
  namespace: stackrox
spec:
  central:
    exposure:
      route:
        enabled: true
  # Online lets Central fetch vulnerability definitions itself. On a
  # disconnected cluster set this to Offline and upload definitions manually --
  # without them Central runs but reports no vulnerabilities, which looks
  # exactly like a clean cluster. See the README.
  egress:
    connectivityPolicy: Online
