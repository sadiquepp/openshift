apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# overlays/default minus the load generator.
#
# The loadgenerator (Locust) drives continuous synthetic traffic through the
# whole call graph. That is genuinely useful — traces, metrics and HPA behaviour
# show up without you scripting anything. But it also burns CPU continuously and
# means the app is never idle, which is wrong if you are measuring baseline
# resource usage or want a quiet cluster.
#
# Builds on ../default rather than ../../base so the namespace, labels and any
# image overrides stay defined in exactly one place.

resources:
  - ../default

patches:
  - target:
      kind: Deployment
      name: loadgenerator
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: loadgenerator
  - target:
      kind: ServiceAccount
      name: loadgenerator
    patch: |
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: loadgenerator
