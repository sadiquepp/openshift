---
# ── test_workload ─────────────────────────────────────────────────────────────
# Online Boutique: 11 stateless microservices talking gRPC, plus a load
# generator that keeps traffic flowing on its own. Without it every topic on the
# broker is empty and there is nothing to verify - which is the whole reason it
# is here rather than in a demo directory.
#
# The vendored `tracing` overlay points at the collector deployed by
# ../../README.md (otel-collector.tracing-system). This role applies the overlay
# unchanged and then repoints the services at THIS collector, so both stacks can
# exist on one cluster without editing a file that belongs to the other one.

- name: Render the {{ app_overlay }} overlay
  ansible.builtin.command:
    cmd: "oc kustomize {{ app_dir }}/overlays/{{ app_overlay }}"
  register: _rendered
  changed_when: false
  # `oc` has kustomize built in, so no separate kustomize binary is needed.

- name: Order the rendered objects so the Namespace is created first
  ansible.builtin.set_fact:
    _app_objects: >-
      {{ (_rendered.stdout | from_yaml_all | list | selectattr('kind', 'equalto', 'Namespace') | list)
         + (_rendered.stdout | from_yaml_all | list | rejectattr('kind', 'equalto', 'Namespace') | list) }}
  # These are applied one object at a time rather than as one stream, so unlike
  # `oc apply -f -` there is no guarantee the Namespace lands before the objects
  # inside it. kustomize does emit it first today; this makes that a property of
  # the automation rather than of kustomize's output ordering.

- name: Apply the workload
  kubernetes.core.k8s:
    state: present
    apply: true
    definition: "{{ item }}"
  loop: "{{ _app_objects }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"

- name: Point the traced services at this collector
  kubernetes.core.k8s:
    state: patched
    api_version: apps/v1
    kind: Deployment
    name: "{{ item }}"
    namespace: "{{ app_namespace }}"
    definition:
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - name: COLLECTOR_SERVICE_ADDR
                    value: "{{ otel_collector_name }}-collector.{{ otel_namespace }}.svc.cluster.local:4317"
  loop: "{{ app_traced_deployments }}"
  when: tracing_enabled | bool
  # A strategic-merge patch, and `env` merges on `name` - so this REPLACES that
  # one variable and leaves ENABLE_TRACING and OTEL_SERVICE_NAME alone. Every
  # one of these Deployments has exactly one container, named `server`.

- name: Wait for every deployment to become Available
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ app_namespace }}"
  register: _app_deploys
  retries: 60
  delay: 10
  until: >-
    _app_deploys.resources | length > 0
    and (_app_deploys.resources
         | map(attribute='status.availableReplicas', default=0)
         | select('lt', 1) | list | length) == 0
  # `default=0` on the map matters: a Deployment that has not started yet has no
  # status.availableReplicas at all, and without it this raises instead of
  # retrying.

- name: Read the frontend route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: frontend
    namespace: "{{ app_namespace }}"
  register: _route

- name: Report the workload URL
  ansible.builtin.debug:
    msg: >-
      Online Boutique is up at https://{{ _route.resources[0].spec.host }} -
      the load generator is already driving traffic through it, so the topics
      will start filling within a minute or two.
