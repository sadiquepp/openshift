[defaults]
inventory = inventory.yml
# Two role paths: this directory's own, and the observability stack's, so the
# olm_operator role that installs every other operator in this repo installs
# these too rather than being reimplemented.
roles_path = ./roles:../../ansible/roles
stdout_callback = yaml
display_skipped_hosts = False
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
