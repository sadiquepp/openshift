---
# ── aws_backends ──────────────────────────────────────────────────────────────
# Creates one S3 bucket + IAM policy + IAM user + access key per enabled
# component, then writes them all to a single credentials file.
#
# This role touches AWS ONLY. It never contacts the cluster, so an AWS admin can
# run aws-prereqs.yml with no kubeconfig and hand the resulting file to whoever
# runs cluster.yml.

- name: Resolve the AWS account number
  amazon.aws.aws_caller_info:
    region: "{{ aws_region }}"
  register: _caller

- name: Record the account number
  ansible.builtin.set_fact:
    aws_account_number: "{{ _caller.account }}"

- name: Report which AWS identity is being used
  ansible.builtin.debug:
    msg:
      # Named before anything is created. This phase needs an administrative
      # principal - if the ARN below is one of the least-privilege
      # `*-loki-s3-*` / `tempo-s3-*` users this automation itself mints, the
      # wrong credentials are in play and the first S3 or IAM call will fail.
      - "AWS account : {{ aws_account_number }}"
      - "Identity    : {{ _caller.arn | default('unknown') }}"
      - "Region      : {{ aws_region }}"

- name: Warn when credentials come from the environment
  ansible.builtin.debug:
    msg: >-
      AWS_ACCESS_KEY_ID is set in the environment. Environment variables
      OUTRANK ~/.aws/credentials and any `aws_profile` you set here, so the
      identity above is the one they name. Note that
      observability/README.md's own setup steps export exactly these two
      variable names for the minted Loki and Tempo keys - which are
      least-privilege S3 users and cannot create buckets or IAM users. If the
      identity above is not the administrator you expected, run
      `unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN`
      and try again.
  when: lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') | length > 0
  # Deliberately a warning, not a failure: supplying admin credentials through
  # the environment is perfectly normal in CI.

- name: Read any credentials already minted by a previous run
  ansible.builtin.include_vars:
    file: "{{ s3_credentials_file }}"
    name: _previous
  when: s3_credentials_file is file
  no_log: true

- name: Start from what a previous run recorded
  ansible.builtin.set_fact:
    _minted: "{{ (_previous | default({})).observability_s3_backends | default({}) }}"
  no_log: true

- name: Provision each enabled backend
  ansible.builtin.include_tasks: backend.yml
  loop: "{{ observability_backends }}"
  loop_control:
    loop_var: backend
    label: "{{ backend.key }}"
  when: backend.enabled | bool

- name: Write the credentials handoff file
  ansible.builtin.template:
    src: s3-credentials.yml.j2
    dest: "{{ s3_credentials_file }}"
    mode: "0600"
  no_log: true

- name: Summarise
  ansible.builtin.debug:
    msg: >-
      Provisioned {{ _minted | length }} S3 backend(s):
      {{ _minted.keys() | list | join(', ') }}.
      Credentials written to {{ s3_credentials_file }} (mode 0600) - hand this
      file to the cluster admin, then run cluster.yml.
