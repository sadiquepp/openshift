---
# ═══════════════════════════════════════════════════════════════════════════════
# AWS PHASE - runnable on its own, by an AWS admin, with no cluster access.
#
#   ansible-playbook aws-prereqs.yml -e suffix=xipio -e aws_region=ap-south-1
#
# Creates one S3 bucket + least-privilege IAM policy + IAM user + access key per
# enabled component, and writes them to s3-credentials.yml (mode 0600).
#
# Which backends get created follows the same toggles the cluster phase uses, so
# pass the SAME values to both. In particular:
#
#   -e netobserv_use_loki=false     skips the netobserv bucket entirely
#   -e tracing_enabled=false        skips the Tempo bucket
#
# Re-running is safe: existing keys recorded in s3-credentials.yml are reused,
# not rotated.
#
# DISCONNECTED CLUSTERS: there is a second, interchangeable storage phase.
# minio-prereqs.yml does all of the above against a MinIO server on the lab
# network and writes the same s3-credentials.yml, so nothing cluster-side
# changes. Pick one with `s3_provider` (group_vars/all.yml).
# ═══════════════════════════════════════════════════════════════════════════════
- name: Provision the AWS S3 backends for OpenShift observability
  hosts: localhost
  gather_facts: false

  # Applies to every amazon.aws module. `omit` when empty, so the default
  # botocore credential chain is used exactly as it would be otherwise.
  module_defaults:
    group/amazon.aws.aws:
      profile: "{{ aws_profile if (aws_profile | default('') | length > 0) else omit }}"
  roles:
    - role: aws_backends
      when: s3_provider == 'aws'

  post_tasks:
    - name: Explain the skip
      ansible.builtin.debug:
        msg: >-
          Nothing to do: s3_provider is '{{ s3_provider }}', so MinIO owns the
          buckets. Run minio-prereqs.yml instead, or pass -e s3_provider=aws.
      when: s3_provider != 'aws'
      # A skip rather than a failure, so site.yml can import both phases and let
      # the variable pick one.
