---
# ansible-galaxy collection install -r requirements.yml
#
# kubernetes.core additionally needs the Python client on the control node:
#   pip install kubernetes
collections:
  - name: amazon.aws
    version: ">=8.0.0"      # iam_managed_policy / iam_access_key live here since 7.2.0
  - name: kubernetes.core
    version: ">=3.0.0"
  - name: community.general
