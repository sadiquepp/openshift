# Step 3 -- a waypoint: the L7 half of ambient.
#
# A waypoint is an Envoy, deployed per namespace (or per service account), that
# meshed traffic is sent THROUGH when its destination opts in. It is a Gateway
# API Gateway of class `istio-waypoint`; istiod creates a Deployment, Service
# and ServiceAccount, all named `waypoint`, in this namespace.
#
#   oc apply -f 30-waypoint.yaml
#   oc -n online-boutique wait --for=condition=Programmed gateway/waypoint
#
# Creating it routes nothing through it. Opt destinations in with a label --
# the README does this for the whole namespace:
#
#   oc label namespace online-boutique istio.io/use-waypoint=waypoint
#
# `istio.io/waypoint-for: service` means it handles traffic addressed to a
# Service (VIP). Traffic sent straight to a pod IP skips it -- see
# 45-authz-paymentservice-via-waypoint.yaml for what that means for policy.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: online-boutique
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
