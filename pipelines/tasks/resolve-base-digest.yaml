---
# Resolve a base image tag to the digest it points at right now.
#
# build-push.sh does this with `skopeo inspect` before every build and stamps
# the answer into the image as a label, so check-bases.sh can later tell
# whether the base has moved. The pipeline needs the same thing, for the same
# reason, and a Tekton result is the natural carrier.
#
# This runs BEFORE the build deliberately. Resolving the digest afterwards
# would record whatever the tag points at when the build finished, which is not
# necessarily what the build used.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: resolve-base-digest
  namespace: boutique-ci
spec:
  description: >-
    Inspect a base image tag in a registry and return the manifest digest it
    currently resolves to, for stamping into the built image as a label.
  params:
    - name: IMAGE
      type: string
      description: Base image reference, with tag.
    - name: TLS_VERIFY
      type: string
      default: "true"
    - name: SKOPEO_IMAGE
      type: string
      # registry.redhat.io needs the cluster pull secret. quay.io/skopeo/stable
      # is the alternative if this namespace cannot pull from registry.redhat.io.
      default: registry.redhat.io/rhel9/skopeo:latest
  results:
    - name: DIGEST
      description: The sha256 digest the tag resolves to.
  steps:
    - name: inspect
      image: $(params.SKOPEO_IMAGE)
      script: |
        #!/bin/bash
        set -euo pipefail
        digest="$(skopeo inspect \
          --tls-verify=$(params.TLS_VERIFY) \
          --format '{{.Digest}}' \
          "docker://$(params.IMAGE)")"
        # Fail loudly rather than stamping an empty label. A build whose base
        # digest is unknown is one check-bases.sh cannot reason about, and an
        # unprovable base must not read as current.
        case "$digest" in
          sha256:*) ;;
          *) echo "unexpected digest for $(params.IMAGE): '$digest'" >&2; exit 1 ;;
        esac
        printf '%s' "$digest" | tee "$(results.DIGEST.path)"
        echo
