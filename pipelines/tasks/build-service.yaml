---
# Build one Online Boutique service and push it, stamped with the same labels
# build-push.sh writes.
#
# Self-contained on purpose: it resolves its own base-image digests in step 1
# rather than taking them as params from upstream tasks. That was a separate
# resolve-base-digest task until the matrix arrived, and the matrix is why it
# moved. A matrixed task's results are only readable as a flat array with no
# way to ask "which element was emailservice", so eleven resolve TaskRuns
# feeding eleven build TaskRuns would have had to be correlated by index --
# fragile, and silently wrong if one failed. One self-contained TaskRun per
# service cannot mismatch.
#
# WHY NOT THE SHIPPED buildah TASK?
#
# Every Containerfile here takes two to four --build-arg values and each image
# carries seven --label values. The shipped task passes all of them through
# BUILD_EXTRA_ARGS, a single string: an array value containing a space broke on
# the migration from the deprecated ClusterTask (SRVKP-7213) and multi-line
# continuation fails with "accepts at most 1 arg(s)" (SRVKP-8513). Ten flags in
# one string with no quoting of your own is a trap. The labels are also what
# check-bases.sh reads, so they belong as named parameters where a missing one
# is a validation error rather than a silently absent label.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-service
  namespace: boutique-ci
spec:
  description: >-
    Resolve the base image digests, build a Containerfile from this repository
    against application source cloned from upstream, stamp the digests as
    labels, and push.
  params:
    - name: IMAGE
      type: string
      description: Full target reference including registry, repository and tag.
    - name: CONTAINERFILE
      type: string
      description: Path to the Containerfile, relative to the workspace.
    - name: CONTEXT
      type: string
      description: Build context directory, relative to the workspace.
    - name: BUILDER_BASE
      type: string
    - name: RUNTIME_BASE
      type: string
    - name: ENTRY
      type: string
      default: ""
      description: >-
        The one per-service build arg the matrix needs (node and python
        services), passed as --build-arg ENTRY=. Scalar rather than part of
        BUILD_ARGS because matrix params cannot be arrays.
    - name: BUILD_ARGS
      type: array
      default: []
      description: >-
        Further build args as KEY=VALUE. Not settable from a matrix; used by
        the single-service pipeline and by the cache build.
    - name: VERSION
      type: string
    - name: REVISION
      type: string
      description: Build id, the value check-bases.sh prints as "build <id>".
    - name: BASE_SET
      type: string
      description: hardened or ubi.
    - name: STORAGE_DRIVER
      type: string
      default: vfs
    - name: TLS_VERIFY
      type: string
      default: "true"
    - name: BUILDAH_IMAGE
      type: string
      default: registry.redhat.io/rhel9/buildah:latest
    - name: SKOPEO_IMAGE
      type: string
      default: registry.redhat.io/rhel9/skopeo:latest
    - name: CACHE_MOUNT_OPTS
      type: string
      default: ""
      description: >-
        Appended to each cache -v mount, e.g. ":z" if SELinux refuses the
        build access to the volume. Empty works when the build container
        shares the step's SELinux context, which it does here.
  results:
    - name: IMAGE_DIGEST
      description: Digest of the image just pushed. This is what GitOps pins.
    - name: IMAGE_URL
      description: The image reference that was pushed.
    - name: IMAGE_REF
      description: >-
        image:tag@digest in one string. The write-back consumes this rather
        than IMAGE_URL and IMAGE_DIGEST separately: a matrixed task's results
        come back as flat arrays, and pairing two of them by index assumes an
        ordering nothing documents. One self-describing element cannot be
        mispaired.
  workspaces:
    - name: source
      description: Holds both clones -- upstream application source and this repo.
    - name: dockerconfig
      description: >-
        Registry credentials as config.json or .dockerconfigjson at the root.
      optional: true
    - name: registrycerts
      description: >-
        CA certificates for a registry with a private CA, as one or more .crt
        files. Needed when the push fails with "x509: certificate signed by
        unknown authority": the NODES trusting your registry does not make this
        pod trust it.
      optional: true
    - name: cache
      description: >-
        Dependency caches, shared across runs. Mounted INTO the buildah build
        rather than used by this task, because the downloading happens inside
        the build. Every builder stage here runs as USER 0, so the paths are
        the root defaults and need no per-language knowledge -- all six are
        mounted for every service and the irrelevant ones are simply unused.
      optional: true
  volumes:
    - name: varlibcontainers
      emptyDir: {}
    # Steps share the pod but not /tmp, so the digests pass between them here.
    - name: digests
      emptyDir: {}
  steps:
    # Resolved BEFORE the build, so the label records the base the build used
    # rather than whatever the tag points at when the build finishes.
    - name: resolve-bases
      image: $(params.SKOPEO_IMAGE)
      volumeMounts:
        - name: digests
          mountPath: /digests
      script: |
        #!/bin/bash
        set -euo pipefail
        CERTS=()
        if [ "$(workspaces.registrycerts.bound)" = "true" ]; then
          CERTS=(--cert-dir "$(workspaces.registrycerts.path)")
        fi
        resolve() {
          local img="$1" out="$2" digest
          digest="$(skopeo inspect "${CERTS[@]}" \
            --tls-verify=$(params.TLS_VERIFY) \
            --format '{{.Digest}}' "docker://$img")"
          # Fail loudly rather than stamping an empty label. A build whose base
          # digest is unknown is one check-bases.sh cannot reason about, and an
          # unprovable base must not read as current.
          case "$digest" in
            sha256:*) ;;
            *) echo "unexpected digest for $img: '$digest'" >&2; exit 1 ;;
          esac
          printf '%s' "$digest" > "$out"
          echo "$img -> $digest"
        }
        resolve "$(params.BUILDER_BASE)" /digests/builder
        resolve "$(params.RUNTIME_BASE)" /digests/runtime

    - name: build-and-push
      image: $(params.BUILDAH_IMAGE)
      workingDir: $(workspaces.source.path)
      # The only supported way to expand an array param inside a script: put it
      # in args, read it back as "$@".
      args: ["$(params.BUILD_ARGS[*])"]
      securityContext:
        capabilities:
          add: ["SETFCAP"]
      volumeMounts:
        - name: varlibcontainers
          mountPath: /var/lib/containers
        - name: digests
          mountPath: /digests
      script: |
        #!/bin/bash
        set -euo pipefail

        BUILD_ARGS=(--build-arg "BUILDER=$(params.BUILDER_BASE)"
                    --build-arg "RUNTIME=$(params.RUNTIME_BASE)")
        [ -n "$(params.ENTRY)" ] && BUILD_ARGS+=(--build-arg "ENTRY=$(params.ENTRY)")
        for kv in "$@"; do
          BUILD_ARGS+=(--build-arg "$kv")
        done

        # buildah looks in /etc/containers/certs.d/<host:port>/ by default,
        # which this image does not have and the task should not have to write.
        # --cert-dir points it at the mounted directory instead; it reads every
        # .crt in there.
        CERTS=()
        if [ "$(workspaces.registrycerts.bound)" = "true" ]; then
          CERTS=(--cert-dir "$(workspaces.registrycerts.path)")
        fi

        # Dependency caches, mounted into the build. `buildah bud -v` is
        # build-time only -- nothing here is committed to the image.
        #
        # All six go in for every service. A Go build with an empty /root/.npm
        # mounted costs nothing, and the alternative is teaching this task
        # which language each service is, which the matrix already knows and
        # would then have to pass down.
        #
        # Concurrency: the four Go builds share one module cache, which Go is
        # designed for (it locks). Gradle and NuGet are each used by exactly
        # one service, so those paths have a single writer.
        CACHE=()
        if [ "$(workspaces.cache.bound)" = "true" ]; then
          C="$(workspaces.cache.path)"
          O="$(params.CACHE_MOUNT_OPTS)"
          for d in go-mod go-build npm pip gradle nuget; do mkdir -p "$C/$d"; done
          CACHE=(-v "$C/go-mod:/root/go/pkg/mod$O"
                 -v "$C/go-build:/root/.cache/go-build$O"
                 -v "$C/npm:/root/.npm$O"
                 -v "$C/pip:/root/.cache/pip$O"
                 -v "$C/gradle:/root/.gradle$O"
                 -v "$C/nuget:/root/.nuget/packages$O")
        fi

        # Point buildah at the mounted credentials if the workspace is bound.
        # Both key names are accepted because `oc create secret
        # docker-registry` writes .dockerconfigjson while a hand-made secret
        # usually holds config.json.
        AUTH=()
        if [ "$(workspaces.dockerconfig.bound)" = "true" ]; then
          for f in "$(workspaces.dockerconfig.path)/config.json" \
                   "$(workspaces.dockerconfig.path)/.dockerconfigjson"; do
            [ -f "$f" ] && { AUTH=(--authfile "$f"); break; }
          done
          [ "${#AUTH[@]}" -gt 0 ] || {
            echo "dockerconfig workspace is bound but holds neither config.json nor .dockerconfigjson" >&2
            exit 1
          }
        fi

        buildah --storage-driver=$(params.STORAGE_DRIVER) bud \
          "${CERTS[@]}" "${CACHE[@]}" \
          "${BUILD_ARGS[@]}" \
          --label "org.opencontainers.image.base.name=$(params.RUNTIME_BASE)" \
          --label "org.opencontainers.image.base.digest=$(cat /digests/runtime)" \
          --label "org.opencontainers.image.version=$(params.VERSION)" \
          --label "org.opencontainers.image.revision=$(params.REVISION)" \
          --label "online-boutique.build.builder-base.name=$(params.BUILDER_BASE)" \
          --label "online-boutique.build.builder-base.digest=$(cat /digests/builder)" \
          --label "online-boutique.build.base-set=$(params.BASE_SET)" \
          --tls-verify=$(params.TLS_VERIFY) \
          --no-cache \
          -f "$(params.CONTAINERFILE)" \
          -t "$(params.IMAGE)" \
          "$(params.CONTEXT)"

        buildah --storage-driver=$(params.STORAGE_DRIVER) push \
          "${AUTH[@]}" "${CERTS[@]}" \
          --tls-verify=$(params.TLS_VERIFY) \
          --digestfile /tmp/image-digest \
          "$(params.IMAGE)" \
          "docker://$(params.IMAGE)"

        # A result must not carry a trailing newline -- IMAGE_DIGEST ends up in
        # a kustomize digest: field, where a stray one makes an unusable
        # reference.
        digest="$(cat /tmp/image-digest)"
        printf '%s' "$digest"         > "$(results.IMAGE_DIGEST.path)"
        printf '%s' "$(params.IMAGE)" > "$(results.IMAGE_URL.path)"
        printf '%s@%s' "$(params.IMAGE)" "$digest" > "$(results.IMAGE_REF.path)"
        echo
        echo "pushed $(params.IMAGE)@${digest}"
