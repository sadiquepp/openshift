---
# All eleven services on UBI, for the comparison.
#
#   export REGISTRY=registry.example.com:8443
#   sed -e "s|registry.example.com:8443|$REGISTRY|" \
#       -e "s|b20261030|b$(date -u +%Y%m%d%H%M)|" \
#       runs/build-stack-ubi.yaml | oc -n boutique-ci create -f -
#
# The ten base params are all overridden below -- the pipeline defaults are
# the hardened set. These values are the UBI set from bases.env.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: build-stack-ubi-
  namespace: boutique-ci
spec:
  pipelineRef:
    name: build-stack
  taskRunTemplate:
    serviceAccountName: boutique-builder
  params:
    - name: BASE_SET
      value: ubi
    - name: TAG_SUFFIX
      value: "-ubi"
    - name: REGISTRY
      value: registry.example.com:8443/online-boutique
    - name: REVISION
      value: b20261030
    - name: GO_BUILDER
      value: registry.access.redhat.com/ubi9/go-toolset:latest
    - name: GO_RUNTIME
      value: registry.access.redhat.com/ubi9/ubi-micro:latest
    - name: NODE_BUILDER
      value: registry.access.redhat.com/ubi9/nodejs-22:latest
    - name: NODE_RUNTIME
      value: registry.access.redhat.com/ubi9/nodejs-22-minimal:latest
    - name: PY_BUILDER
      value: registry.access.redhat.com/ubi9/python-312:latest
    - name: PY_RUNTIME
      value: registry.access.redhat.com/ubi9/python-312-minimal:latest
    - name: JAVA_BUILDER
      value: registry.access.redhat.com/ubi9/openjdk-21:latest
    - name: JAVA_RUNTIME
      value: registry.access.redhat.com/ubi9/openjdk-21-runtime:latest
    - name: DOTNET_SDK
      value: registry.access.redhat.com/ubi9/dotnet-100:latest
    - name: DOTNET_RUNTIME
      value: registry.access.redhat.com/ubi9/dotnet-100-runtime:latest
    # Write-back: off, and dry by default. Flip WRITE_BACK to "true" to pin
    # this run's digests into sadiquepp/boutique-deploy; leave
    # WRITE_BACK_DRY_RUN at "true" for the first few runs -- it clones, pins and
    # prints the diff without pushing, which is the cheap way to find out that
    # the credential or the path is wrong.
    #
    #   sed -e 's|WRITE_BACK$|WRITE_BACK|' ...   # see ../README.md
    # ACS build gate: off, and non-blocking when first switched on.
    - name: ACS_CHECK
      value: "false"
    - name: ACS_BLOCKING
      value: "false"
    - name: ROX_CENTRAL_ADDRESS
      value: central-stackrox.apps.example.com:443
    - name: WRITE_BACK
      value: "false"
    - name: WRITE_BACK_DRY_RUN
      value: "true"
    - name: DEPLOY_PATH
      value: hub1/ubi
    - name: DEPLOY_REVISION
      value: main
    - name: RECIPES_REVISION
      value: claude/vigilant-babbage-4qxa4j
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              # Eleven builds share this read-only after the clones; the Java
              # and .NET builds are what make it bigger than phase 1 needed.
              storage: 20Gi
    - name: dockerconfig
      secret:
        secretName: registry-auth
    - name: registrycerts
      configMap:
        name: registry-ca
    # Harmless when WRITE_BACK is "false" -- the pipeline declares it optional.
    - name: gitauth
      secret:
        secretName: boutique-deploy-git
    # Bound by name, not a volumeClaimTemplate: a cache deleted with the run
    # is not a cache. See ../03-build-cache.yaml.
    - name: cache
      persistentVolumeClaim:
        claimName: boutique-build-cache
    # Harmless when ACS_CHECK is "false". Central presents the cluster
    # ingress certificate once its defaultTLSSecret is patched, so this is the
    # router CA -- the same file ../../acs/ uses.
    - name: roxcerts
      configMap:
        name: rox-ca
        optional: true
