---
# All eleven services on Red Hat Hardened Images.
#
#   export REGISTRY=registry.example.com:8443
#   sed -e "s|registry.example.com:8443|$REGISTRY|" \
#       -e "s|b20261030|b$(date -u +%Y%m%d%H%M)|" \
#       runs/build-stack-hardened.yaml | oc -n boutique-ci create -f -
#
# The base images are the pipeline's defaults (the hardened set from
# bases.env), so they are not repeated here. Override one on the command line
# if you are testing a new base.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: build-stack-hardened-
  namespace: boutique-ci
spec:
  pipelineRef:
    name: build-stack
  taskRunTemplate:
    serviceAccountName: boutique-builder
  params:
    - name: BASE_SET
      value: hardened
    - name: TAG_SUFFIX
      value: ""
    - name: REGISTRY
      value: registry.example.com:8443/online-boutique
    - name: REVISION
      value: b20261030
    - name: RECIPES_REVISION
      value: claude/vigilant-babbage-4qxa4j
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              # Eleven builds share this read-only after the clones; the Java
              # and .NET builds are what make it bigger than phase 1 needed.
              storage: 20Gi
    - name: dockerconfig
      secret:
        secretName: registry-auth
    - name: registrycerts
      configMap:
        name: registry-ca
