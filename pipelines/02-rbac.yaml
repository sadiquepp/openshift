---
# Namespace and identity for the build pipeline.
#
# Nothing here is specific to the Online Boutique workload -- it is the
# plumbing every buildah-based pipeline on OpenShift needs: a service account,
# the SCC that lets buildah run, and the registry credentials and CA the push
# needs. Apply this first and get it working before any pipeline exists.
apiVersion: v1
kind: Namespace
metadata:
  name: boutique-ci
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: boutique-builder
  namespace: boutique-ci
---
# The OpenShift Pipelines operator creates a "pipeline" SA in every namespace
# and binds pipelines-scc to it. A dedicated SA is used here instead so the
# build identity is explicit and can be tightened independently.
#
# pipelines-scc is based on anyuid and additionally allows SETFCAP, which is
# what buildah needs to write file capabilities while unpacking a base image.
# The shipped buildah task defaults to the vfs storage driver because overlay
# needs more privilege than this.
#
# >> DECISION POINT, and for this repository it is not a detail. <<
#
# Red Hat's guidance is that the simplest way to guarantee every image builds
# is to run buildah as root under the privileged SCC. Do not reach for that
# here without thinking: these pipelines exist to produce hardened images, and
# a privileged builder is the first thing a reviewer will point at.
#
# In order of preference:
#   1. pipelines-scc, below -- try this first, it is enough for every
#      Containerfile in test-workloads/online-boutique/hardened/.
#   2. The documented unprivileged buildah setup (custom SCC, requires
#      allowPrivilegeEscalation) if a build fails on capabilities. See
#      "Unprivileged building of container images using buildah" in the
#      OpenShift Pipelines docs for YOUR version -- the SCC differs between
#      versions, so copy it from there rather than from a blog.
#   3. OpenShift Pipelines 1.20+ ships a buildah-ns task for this case.
#   4. privileged, only with a written reason.
# Granting an SCC means granting `use` on that one SCC object. OpenShift
# generates a system:openshift:scc:<name> ClusterRole for its SCCs and binding
# to that is the usual shorthand -- but it is not safe to rely on here: whether
# one exists for an operator-created SCC like pipelines-scc varies, and a
# RoleBinding naming a ClusterRole that does not exist is CREATED SUCCESSFULLY
# and grants nothing. The failure then arrives much later, as
#
#   pods "...-build-pod" is forbidden: unable to validate against any security
#   context constraint: [... provider "pipelines-scc": Forbidden: not usable by
#   user or serviceaccount ...]
#
# which does not hint that the binding is the problem. So the rule is spelled
# out here and the Role is ours.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: boutique-builder-use-pipelines-scc
  namespace: boutique-ci
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["pipelines-scc"]
    verbs: ["use"]
---
# roleRef is immutable. If a RoleBinding of this name already exists pointing
# at something else, `oc apply` fails with "cannot change roleRef" -- delete it
# first:
#
#   oc delete rolebinding boutique-builder-scc -n boutique-ci
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: boutique-builder-scc
  namespace: boutique-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: boutique-builder-use-pipelines-scc
subjects:
  - kind: ServiceAccount
    name: boutique-builder
    namespace: boutique-ci
---
# Push credentials for your registry, as a docker config. The build task mounts
# this at a workspace and points buildah at it; it is NOT linked to the service
# account, so it cannot leak into unrelated pods in this namespace.
#
#   oc -n boutique-ci create secret docker-registry registry-auth \
#     --docker-server=registry.example.com:8443 \
#     --docker-username='<user>' --docker-password='<password>'
#
# Note --docker-server must match the registry host in IMAGE exactly, port
# included, or buildah will not find the entry and the push fails as 401.
---
# If your registry uses a private CA, the build pods need to trust it. On
# OpenShift the supported path is a ConfigMap labelled for injection, which the
# Network Operator fills in with the cluster trust bundle:
#
#   oc -n boutique-ci create configmap registry-ca \
#     --from-file=ca-bundle.crt=/path/to/ca.crt
#
# Verify the SCC grant BEFORE running a pipeline -- the answer must be yes:
#
#   oc auth can-i use scc/pipelines-scc \
#     --as=system:serviceaccount:boutique-ci:boutique-builder -n boutique-ci
#
# If it says no, check the SCC actually exists under that name
# (`oc get scc pipelines-scc`); on a cluster where the operator named it
# something else, put that name in resourceNames above.
---
# This is the same CA problem solved for the cluster in step 5 of
# test-workloads/online-boutique/hardened/README.md. Solving it there does not
# solve it here: that made the NODES trust the registry, this makes the BUILD
# POD trust it. Two different trust stores, same certificate.
