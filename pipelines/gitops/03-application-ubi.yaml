---
# Online Boutique on the ubi base set, deployed by Argo CD.
#
# Modelled on sadiquepp/ocp-onpremise gitops/apps/online-boutique.yaml -- same
# operator, same default instance, same convention that the platform admin owns
# the namespace.
#
# Deliberately thin. Everything that varies per cluster -- the registry, the
# image digests, the target namespace -- is in sadiquepp/boutique-deploy, so
# this file says only WHERE the desired state is and WHERE it goes. Nothing
# here needs editing between clusters or between builds; the pipeline updates
# the other repository and Argo CD notices.
#
# targetRevision is a branch, not a commit, and that is the point: the deployed
# artefact is pinned by digest in boutique-deploy, so pinning the commit as
# well would mean two things to bump per build and no extra determinism.
#
#   oc apply -f 03-application-ubi.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-ubi
  namespace: openshift-gitops
  # Deleting the Application deletes what it deployed. Without this finalizer,
  # deleting it only stops Argo CD tracking the resources.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/sadiquepp/boutique-deploy
    targetRevision: main
    path: hub1/ubi
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique-ubi
  # No 'automated' to begin with: Argo CD reports drift and you press Sync.
  # Turn it on once a sync has worked -- with self-heal, a hand edit in this
  # namespace is undone, which is the point and also a surprise the first time.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false   # 01-namespaces.yaml owns it
