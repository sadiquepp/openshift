---
# ── letsencrypt_certs (connected-only) ────────────────────────────────────
# Renders the Let's Encrypt CA bundle, API/Ingress cert secrets, and the
# apply script — all gated on letsencrypt_enabled. Pairs with the
# letsencrypt.tf Terraform module that actually issues the certs.

- name: Render Let's Encrypt CA bundle
  ansible.builtin.template:
    src: "{{ cloud_provider }}/letsencrypt-ca-bundle.pem.j2"
    dest: "{{ home_dir }}/letsencrypt-ca-bundle.pem"
  when: letsencrypt_enabled | default(false) | bool

- name: Render Let's Encrypt API certificate secret
  ansible.builtin.template:
    src: "{{ cloud_provider }}/letsencrypt-api-cert-secret.yaml.j2"
    dest: "{{ home_dir }}/letsencrypt-api-cert-secret.yaml"
  when: letsencrypt_enabled | default(false) | bool

- name: Render Let's Encrypt Ingress certificate secret
  ansible.builtin.template:
    src: "{{ cloud_provider }}/letsencrypt-ingress-cert-secret.yaml.j2"
    dest: "{{ home_dir }}/letsencrypt-ingress-cert-secret.yaml"
  when: letsencrypt_enabled | default(false) | bool

- name: Render Let's Encrypt cert apply script
  ansible.builtin.template:
    src: "{{ cloud_provider }}/apply-letsencrypt-certs.sh.j2"
    dest: "{{ home_dir }}/apply-letsencrypt-certs.sh"
    mode: "0755"
  when: letsencrypt_enabled | default(false) | bool
